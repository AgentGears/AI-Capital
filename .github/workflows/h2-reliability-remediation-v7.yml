name: H2.7 Issued Authority Recovery Remediation

on:
  push:
    branches:
      - h2-reliability-remediation-v7

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: h2-reliability-hardening
          fetch-depth: 0
      - name: Apply remediation
        shell: bash
        run: |
          git fetch origin h2-reliability-remediation-v7
          git show origin/h2-reliability-remediation-v7:.github/h2-reliability-remediation-v7.py > /tmp/h2-reliability-remediation-v7.py
          python /tmp/h2-reliability-remediation-v7.py
      - name: Validate and push
        shell: bash
        run: |
          python -m pip install pytest
          PYTHONPATH=src python -m pytest -q tests/test_h2_reliability_review.py tests/test_h2_reliability_hardening.py tests/test_k4_authority.py tests/test_k5_operation_journal.py tests/test_h2_product_capabilities.py
          git diff --check
          git config user.name "AI Capital Maintainer"
          git config user.email "55954113+Alajmah@users.noreply.github.com"
          git add src/ai_capital/kernel/authority_store.py src/ai_capital/product/capability_operator.py tests/test_h2_reliability_review.py
          git commit -m "H2.7: recover issued authority across restart"
          git push origin HEAD:h2-reliability-hardening
