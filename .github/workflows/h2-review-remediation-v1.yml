name: H2.7 Review Remediation

on:
  push:
    branches:
      - h2-review-remediation-v1

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: h2-reliability-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply review remediation
        run: |
          git fetch origin h2-review-remediation-v1
          git show origin/h2-review-remediation-v1:.github/scripts/h2_review_remediate_v1.py > /tmp/h2_review_remediate_v1.py
          python /tmp/h2_review_remediate_v1.py
      - run: python -m pip install -q pytest
      - name: Targeted regressions
        run: PYTHONPATH=src python -m pytest -q tests/test_h2_reliability_restart_matrix.py tests/test_h2_reliability_review.py
      - name: Full suite and diff check
        run: |
          git diff --check
          PYTHONPATH=src python -m pytest -q
      - name: Commit remediation
        run: |
          git config user.name "AI Capital Automation"
          git config user.email "ai-capital@users.noreply.github.com"
          git add src/ai_capital/kernel/operation_journal.py src/ai_capital/product/reliability.py src/ai_capital/product/capability_operator.py src/ai_capital/product/program_operator.py src/ai_capital/product/capability_executors.py tests/test_h2_reliability_restart_matrix.py tests/test_h2_reliability_review.py
          git commit -m "Harden H2.7 recovery and Git observation"
          git push origin HEAD:h2-reliability-hardening
