name: K8 Round 38 autonomous remediation

on:
  push:
    branches:
      - k8-round38-autonomous-remediation

permissions:
  contents: write

jobs:
  remediate-and-prove:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Round 38 remediation
        run: |
          python .github/k8-round38-remediate.py
          python .github/k8-round38-compat.py
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Focused Round 21 and 31-38 proof
        env:
          PYTHONPATH: src
        run: >-
          pytest -q
          tests/test_k8_review_round21.py
          tests/test_k8_review_round31.py
          tests/test_k8_review_round32.py
          tests/test_k8_review_round33.py
          tests/test_k8_review_round34.py
          tests/test_k8_review_round35.py
          tests/test_k8_review_round36.py
          tests/test_k8_review_round37.py
          tests/test_k8_review_round38.py
      - name: Exact source-test full proof
        env:
          PYTHONPATH: src
        run: pytest -q
      - name: Publish clean proved implementation commit
        shell: bash
        run: |
          rm .github/workflows/k8-round38-autonomous-remediation.yml
          rm .github/k8-round38-remediate.py
          rm .github/k8-round38-compat.py
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          rm -rf .pytest_cache
          git config user.name "AI Capital automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "K8: close Round 38 selector and restart gaps"
          git push origin HEAD:k8-bounded-context
