name: H2.7 Pinned Git Metadata Remediation

on:
  push:
    branches:
      - h2-reliability-remediation-v8

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: h2-reliability-hardening
          fetch-depth: 0
      - name: Apply remediation
        shell: bash
        run: |
          git fetch origin h2-reliability-remediation-v8
          git show origin/h2-reliability-remediation-v8:.github/h2-reliability-remediation-v8.py > /tmp/h2-reliability-remediation-v8.py
          python /tmp/h2-reliability-remediation-v8.py
      - name: Validate and push
        shell: bash
        run: |
          python -m pip install pytest
          PYTHONPATH=src python -m pytest -q tests/test_h2_product_capability_review.py tests/test_h2_git_observation_guard.py tests/test_h2_product_capability_security.py tests/test_h2_reliability_hardening.py
          git diff --check
          git config user.name "AI Capital Maintainer"
          git config user.email "55954113+Alajmah@users.noreply.github.com"
          git add src/ai_capital/product/git_repository_guard.py src/ai_capital/product/capability_executors.py tests/test_h2_product_capability_review.py
          git commit -m "H2.7: pin Git metadata before validation"
          git push origin HEAD:h2-reliability-hardening
