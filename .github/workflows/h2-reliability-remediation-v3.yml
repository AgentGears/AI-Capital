name: H2.7 Reliability Remediation v3

on:
  push:
    branches:
      - h2-reliability-remediation-v3

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: h2-reliability-hardening
          fetch-depth: 0
      - name: Apply remediation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          def exact_count(text: str, old: str, new: str, expected: int, label: str) -> str:
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{label}: expected {expected} matches, found {count}")
              return text.replace(old, new)

          path = Path("src/ai_capital/product/rooted_io.py")
          text = path.read_text()
          text = once(
              text,
              "def _open_root(root: Path) -> int:\n    _require_platform_support()\n    root = root.resolve()\n",
              "def _open_root(\n    root: Path,\n    *,\n    expected_identity: tuple[int, int] | None = None,\n) -> int:\n    _require_platform_support()\n    root = Path(root)\n    if not root.is_absolute():\n        raise ExecutionFailure(\"capability root must be absolute for rooted access\")\n",
              "root open",
          )
          text = once(
              text,
              "        or not _same_identity(before, opened)\n    ):\n        os.close(descriptor)\n        raise ExecutionFailure(\"capability root changed during rooted access\")\n    return descriptor\n",
              "        or not _same_identity(before, opened)\n        or (\n            expected_identity is not None\n            and (int(opened.st_dev), int(opened.st_ino)) != expected_identity\n        )\n    ):\n        os.close(descriptor)\n        raise ExecutionFailure(\"capability root changed during rooted access\")\n    return descriptor\n\n\ndef root_identity(root: Path) -> tuple[int, int]:\n    descriptor = _open_root(root)\n    try:\n        info = os.fstat(descriptor)\n        return int(info.st_dev), int(info.st_ino)\n    finally:\n        os.close(descriptor)\n",
              "root identity",
          )
          text = once(
              text,
              "def _open_parent(root: Path, target: str) -> tuple[int, int, str]:\n    root_fd = _open_root(root)\n",
              "def _open_parent(\n    root: Path,\n    target: str,\n    *,\n    expected_root_identity: tuple[int, int] | None = None,\n) -> tuple[int, int, str]:\n    root_fd = _open_root(root, expected_identity=expected_root_identity)\n",
              "parent identity",
          )
          text = once(
              text,
              "def read_regular(root: Path, target: str, *, max_bytes: int) -> bytes:\n    root_fd, parent_fd, name = _open_parent(root, target)\n",
              "def read_regular(\n    root: Path,\n    target: str,\n    *,\n    max_bytes: int,\n    expected_root_identity: tuple[int, int] | None = None,\n) -> bytes:\n    root_fd, parent_fd, name = _open_parent(\n        root, target, expected_root_identity=expected_root_identity\n    )\n",
              "read identity",
          )
          text = once(
              text,
              "        descriptor = os.open(\n            name,\n            os.O_RDONLY | os.O_NOFOLLOW | getattr(os, \"O_BINARY\", 0),\n            dir_fd=parent_fd,\n        )\n",
              "        descriptor = os.open(\n            name,\n            os.O_RDONLY\n            | os.O_NOFOLLOW\n            | getattr(os, \"O_NONBLOCK\", 0)\n            | getattr(os, \"O_BINARY\", 0),\n            dir_fd=parent_fd,\n        )\n",
              "read nonblocking",
          )
          text = once(
              text,
              "def list_directory(root: Path, target: str) -> list[dict[str, object]]:\n    root_fd = _open_root(root)\n",
              "def list_directory(\n    root: Path,\n    target: str,\n    *,\n    expected_root_identity: tuple[int, int] | None = None,\n) -> list[dict[str, object]]:\n    root_fd = _open_root(root, expected_identity=expected_root_identity)\n",
              "list identity",
          )
          text = once(
              text,
              "def atomic_write(root: Path, target: str, content: bytes) -> None:\n    root_fd, parent_fd, name = _open_parent(root, target)\n",
              "def atomic_write(\n    root: Path,\n    target: str,\n    content: bytes,\n    *,\n    expected_root_identity: tuple[int, int] | None = None,\n) -> None:\n    root_fd, parent_fd, name = _open_parent(\n        root, target, expected_root_identity=expected_root_identity\n    )\n",
              "atomic identity",
          )
          text = once(
              text,
              "def exclusive_create(root: Path, target: str, content: bytes) -> None:\n    root_fd, parent_fd, name = _open_parent(root, target)\n",
              "def exclusive_create(\n    root: Path,\n    target: str,\n    content: bytes,\n    *,\n    expected_root_identity: tuple[int, int] | None = None,\n) -> None:\n    root_fd, parent_fd, name = _open_parent(\n        root, target, expected_root_identity=expected_root_identity\n    )\n",
              "exclusive identity",
          )
          text = once(
              text,
              "def open_pinned(\n    root: Path,\n    target: str,\n    *,\n    allow_directory: bool,\n) -> tuple[int, int]:\n    \"\"\"Return (root_fd, target_fd) pinned beneath root for subprocess observation.\"\"\"\n    root_fd = _open_root(root)\n",
              "def open_pinned(\n    root: Path,\n    target: str,\n    *,\n    allow_directory: bool,\n    expected_root_identity: tuple[int, int] | None = None,\n) -> tuple[int, int]:\n    \"\"\"Return (root_fd, target_fd) pinned beneath root for subprocess observation.\"\"\"\n    root_fd = _open_root(root, expected_identity=expected_root_identity)\n",
              "pinned identity",
          )
          text = once(
              text,
              "        flags = os.O_RDONLY | os.O_NOFOLLOW | getattr(os, \"O_BINARY\", 0)\n",
              "        flags = (\n            os.O_RDONLY\n            | os.O_NOFOLLOW\n            | getattr(os, \"O_NONBLOCK\", 0)\n            | getattr(os, \"O_BINARY\", 0)\n        )\n",
              "pinned nonblocking",
          )
          text = once(
              text,
              "        return root_fd, target_fd\n    except OSError as exc:\n        if target_fd is not None:\n            os.close(target_fd)\n        os.close(root_fd)\n        raise ExecutionFailure(\"capability target changed during rooted observation\") from exc\n",
              "        return root_fd, target_fd\n    except InvalidRequest:\n        if target_fd is not None:\n            os.close(target_fd)\n        os.close(root_fd)\n        raise\n    except OSError as exc:\n        if target_fd is not None:\n            os.close(target_fd)\n        os.close(root_fd)\n        raise ExecutionFailure(\"capability target changed during rooted observation\") from exc\n",
              "pinned cleanup",
          )
          path.write_text(text)

          path = Path("src/ai_capital/product/capability_executors.py")
          text = path.read_text()
          text = once(
              text,
              "        artifact_root: Path,\n        before_dispatch: Callable[[], None] | None = None,\n",
              "        artifact_root: Path,\n        workspace_root_identity: tuple[int, int] | None = None,\n        artifact_root_identity: tuple[int, int] | None = None,\n        before_dispatch: Callable[[], None] | None = None,\n",
              "executor signature",
          )
          text = once(text, "        self._workspace_root = workspace_root.resolve()\n", "        self._workspace_root = Path(workspace_root)\n", "workspace lexical")
          text = once(text, "        self._artifact_root = artifact_root.resolve()\n", "        self._artifact_root = Path(artifact_root)\n", "artifact lexical")
          text = once(text, "        self._workspace_root.mkdir(parents=True, exist_ok=True)\n", "", "workspace mkdir")
          text = once(text, "        self._artifact_root.mkdir(parents=True, exist_ok=True)\n", "", "artifact mkdir")
          text = once(
              text,
              "        self._before_dispatch = before_dispatch\n",
              "        if not self._workspace_root.is_absolute() or not self._artifact_root.is_absolute():\n            raise InvalidRequest(\"product capability roots must be absolute\")\n        self._workspace_root_identity = workspace_root_identity\n        self._artifact_root_identity = artifact_root_identity\n        self._before_dispatch = before_dispatch\n",
              "executor root identity fields",
          )
          text = exact_count(
              text,
              "            max_bytes=_MAX_OBSERVATION_BYTES,\n        )\n",
              "            max_bytes=_MAX_OBSERVATION_BYTES,\n            expected_root_identity=self._workspace_root_identity,\n        )\n",
              2,
              "read call identities",
          )
          text = once(
              text,
              "        entries = list_directory(self._workspace_root, target)\n",
              "        entries = list_directory(\n            self._workspace_root,\n            target,\n            expected_root_identity=self._workspace_root_identity,\n        )\n",
              "list call identity",
          )
          text = exact_count(
              text,
              "        atomic_write(self._workspace_root, target, exact)\n",
              "        atomic_write(\n            self._workspace_root,\n            target,\n            exact,\n            expected_root_identity=self._workspace_root_identity,\n        )\n",
              2,
              "write call identities",
          )
          text = once(
              text,
              "            allow_directory=allow_directory,\n        )\n",
              "            allow_directory=allow_directory,\n            expected_root_identity=self._workspace_root_identity,\n        )\n",
              "command root identity",
          )
          text = once(
              text,
              "            allow_directory=True,\n        )\n        git_fd: int | None = None\n",
              "            allow_directory=True,\n            expected_root_identity=self._workspace_root_identity,\n        )\n        git_fd: int | None = None\n",
              "git root identity",
          )
          text = once(
              text,
              "        exclusive_create(self._artifact_root, target, exact)\n",
              "        exclusive_create(\n            self._artifact_root,\n            target,\n            exact,\n            expected_root_identity=self._artifact_root_identity,\n        )\n",
              "artifact root identity",
          )
          path.write_text(text)

          path = Path("src/ai_capital/product/capability_operator.py")
          text = path.read_text()
          text = once(
              text,
              "from .reliability import ProductRequestRecord, ProductRequestRepository\n",
              "from .reliability import ProductRequestRecord, ProductRequestRepository\nfrom .rooted_io import root_identity\n",
              "operator root import",
          )
          text = once(
              text,
              "        _prepare_capability_root(self._workspace_root)\n        _prepare_capability_root(self._artifact_root)\n\n        self._actors = ActorRepository(programs)\n",
              "        _prepare_capability_root(self._workspace_root)\n        _prepare_capability_root(self._artifact_root)\n        self._workspace_root_identity = root_identity(self._workspace_root)\n        self._artifact_root_identity = root_identity(self._artifact_root)\n\n        self._actors = ActorRepository(programs)\n",
              "operator captured identities",
          )
          text = once(
              text,
              "                if record.state == \"completed\":\n                    assert record.result is not None\n                    return record.result\n                return self._recover_pending_request(record)\n",
              "                if record.state == \"completed\":\n                    assert record.result is not None\n                    if record.result.get(\"state\") == \"approval_required\":\n                        return self._recover_pending_request(record)\n                    return record.result\n                return self._recover_pending_request(record)\n",
              "approval restart replay",
          )
          text = once(
              text,
              "            artifact_root=self._artifact_root,\n            before_dispatch=lambda: self._require_program_ready(program_id),\n",
              "            artifact_root=self._artifact_root,\n            workspace_root_identity=self._workspace_root_identity,\n            artifact_root_identity=self._artifact_root_identity,\n            before_dispatch=lambda: self._require_program_ready(program_id),\n",
              "executor captured identity args",
          )
          path.write_text(text)
          PY

          cat > tests/test_h2_reliability_review.py <<'PY'
          from __future__ import annotations

          import os
          from pathlib import Path
          import tempfile
          import time
          import unittest

          from ai_capital.kernel.actor_store import ActorRepository
          from ai_capital.kernel.durable_program import ProgramRepository
          from ai_capital.kernel.enums import ProgramStatus
          from ai_capital.kernel.models import Actor, Program
          from ai_capital.product import LocalCapabilityOperator, LocalProgramOperator


          @unittest.skipIf(os.name == "nt", "descriptor-rooted reliability requires POSIX")
          class H2ReliabilityReviewTests(unittest.TestCase):
              def _fixture(self, root: Path) -> tuple[Path, Path, Path]:
                  database = root / "capital.db"
                  workspace = root / "workspace"
                  artifacts = root / "generated-artifacts"
                  workspace.mkdir()
                  artifacts.mkdir()
                  with ProgramRepository(database) as programs:
                      programs.create(Program("p-1", 0, "H2.7 review remediation"))
                      programs.transition("p-1", ProgramStatus.ACTIVE, expected_revision=0)
                      ActorRepository(programs).register(Actor("a-1", 0, "worker", "configured-binding"))
                  return database, workspace, artifacts

              def _open(self, database: Path, workspace: Path, artifacts: Path):
                  return LocalCapabilityOperator.open(database, workspace_root=workspace, artifact_root=artifacts)

              @unittest.skipUnless(hasattr(os, "mkfifo"), "FIFO creation is unavailable")
              def test_workspace_read_rejects_fifo_without_blocking(self):
                  with tempfile.TemporaryDirectory() as directory:
                      root = Path(directory)
                      database, workspace, artifacts = self._fixture(root)
                      os.mkfifo(workspace / "pipe")
                      with self._open(database, workspace, artifacts) as operator:
                          operator.grant(actor_id="a-1", capability_id="workspace.read", resource_scope=("pipe",))
                          started = time.monotonic()
                          result = operator.invoke(program_id="p-1", actor_id="a-1", capability_id="workspace.read", arguments={"path": "pipe"})
                          elapsed = time.monotonic() - started
                      self.assertLess(elapsed, 2)
                      self.assertEqual(result["operation"]["execution_outcome"], "failed")
                      self.assertEqual(result["operation"]["effect_status"], "not_applicable")

              def test_workspace_root_swap_to_symlink_fails_closed(self):
                  if not hasattr(os, "symlink"):
                      self.skipTest("symlinks unavailable")
                  with tempfile.TemporaryDirectory() as directory:
                      root = Path(directory)
                      database, workspace, artifacts = self._fixture(root)
                      pinned = root / "workspace-pinned"
                      outside = root / "outside"
                      outside.mkdir()
                      with self._open(database, workspace, artifacts) as operator:
                          operator.grant(actor_id="a-1", capability_id="workspace.write", resource_scope=("escape.txt",))
                          workspace.rename(pinned)
                          workspace.symlink_to(outside, target_is_directory=True)
                          result = operator.invoke(program_id="p-1", actor_id="a-1", capability_id="workspace.write", arguments={"path": "escape.txt", "content": "must stay confined"})
                      self.assertEqual(result["operation"]["execution_outcome"], "failed")
                      self.assertFalse((outside / "escape.txt").exists())
                      self.assertFalse((pinned / "escape.txt").exists())

              def test_approved_request_recovers_running_operation_after_restart(self):
                  with tempfile.TemporaryDirectory() as directory:
                      root = Path(directory)
                      database, workspace, artifacts = self._fixture(root)
                      arguments = {"path": "approved.txt", "content": "approved once\n"}
                      with self._open(database, workspace, artifacts) as operator:
                          operator.grant(actor_id="a-1", capability_id="workspace.write", resource_scope=("approved.txt",), approval_required=True)
                          pending = operator.invoke(program_id="p-1", actor_id="a-1", capability_id="workspace.write", arguments=arguments, request_id="req-approved-restart")
                      decision_id = pending["decision"]["decision_id"]
                      with LocalProgramOperator.open(database) as programs:
                          approved = programs.approve(decision_id)
                          approval_id = approved["approval"]["receipt"]["approval_id"]

                      with self._open(database, workspace, artifacts) as operator:
                          context = operator._authority_store.get_decision(decision_id)
                          authority = operator._authority.issue_execution_authority(decision_id=decision_id, approval_id=approval_id)
                          operation = operator._journal.create_intent(program_id=context.program_id, actor_id=context.actor_id, resolution=context.resolution, authority_receipt_ref=authority.receipt_id)
                          operator._authority.consume_execution_authority(receipt_id=authority.receipt_id)
                          operator._journal.mark_admitted(operation.operation_id)
                          operator._journal.mark_running(operation.operation_id)
                          operation_id = operation.operation_id

                      with self._open(database, workspace, artifacts) as operator:
                          replay = operator.invoke(program_id="p-1", actor_id="a-1", capability_id="workspace.write", arguments=arguments, request_id="req-approved-restart")
                          count = int(operator._programs._db.execute("SELECT COUNT(*) FROM operation_projections").fetchone()[0])
                      self.assertEqual(replay["state"], "executed")
                      self.assertEqual(replay["operation"]["operation_id"], operation_id)
                      self.assertEqual(replay["operation"]["effect_status"], "indeterminate")
                      self.assertEqual(replay["operation"]["reconciliation_status"], "pending")
                      self.assertEqual(count, 1)
                      self.assertFalse((workspace / "approved.txt").exists())


          if __name__ == "__main__":
              unittest.main()
          PY

      - name: Validate and push
        shell: bash
        run: |
          python -m pip install pytest
          PYTHONPATH=src python -m pytest -q tests/test_h2_reliability_review.py tests/test_h2_reliability_hardening.py tests/test_h2_product_capability_review.py tests/test_h2_product_capability_security.py
          git diff --check
          git config user.name "AI Capital Maintainer"
          git config user.email "55954113+Alajmah@users.noreply.github.com"
          git add src/ai_capital/product/capability_executors.py src/ai_capital/product/rooted_io.py src/ai_capital/product/capability_operator.py tests/test_h2_reliability_review.py
          git commit -m "H2.7: remediate reliability review findings"
          git push origin HEAD:h2-reliability-hardening
