name: H2.7 Review Regression Qualification

on:
  push:
    branches:
      - h2-reliability-review-tests-v1

permissions:
  contents: write

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: h2-reliability-hardening
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply review regressions
        run: |
          git fetch origin h2-reliability-review-tests-v1
          git show origin/h2-reliability-review-tests-v1:.github/scripts/h2_reliability_review_tests_v1.py > /tmp/h2_reliability_review_tests_v1.py
          python /tmp/h2_reliability_review_tests_v1.py
      - run: python -m pip install -q pytest
      - name: Targeted reliability regressions
        run: |
          PYTHONPATH=src python -m pytest -q tests/test_h2_reliability_review.py tests/test_h2_reliability_restart_matrix.py
      - name: Diff and full suite
        run: |
          git diff --check
          PYTHONPATH=src python -m pytest -q
      - name: Commit qualified regressions
        run: |
          git config user.name "AI Capital Automation"
          git config user.email "ai-capital@users.noreply.github.com"
          git add tests/test_h2_reliability_review.py tests/test_h2_reliability_restart_matrix.py
          git commit -m "Qualify H2.7 concurrent duplicate and link recovery"
          git push origin HEAD:h2-reliability-hardening
