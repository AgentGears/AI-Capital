name: H2.7 Consolidated Reliability Remediation

on:
  push:
    branches:
      - h2-reliability-remediation-v10

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: h2-reliability-hardening
          fetch-depth: 0
      - name: Apply remediation
        shell: bash
        run: |
          git fetch origin h2-reliability-remediation-v10
          git show origin/h2-reliability-remediation-v10:.github/h2-reliability-remediation-v10.py > /tmp/h2-reliability-remediation-v10.py
          python /tmp/h2-reliability-remediation-v10.py
          python - <<'PY'
          from pathlib import Path
          path = Path('src/ai_capital/product/git_repository_guard.py')
          path.write_text(path.read_text().rstrip() + '\n')
          PY
      - name: Validate and push
        shell: bash
        run: |
          python -m pip install pytest
          PYTHONPATH=src python -m pytest -q \
            tests/test_h2_reliability_review.py \
            tests/test_h2_reliability_hardening.py \
            tests/test_h2_reliability_restart_matrix.py \
            tests/test_h2_product_capability_review.py \
            tests/test_h2_product_capability_security.py \
            tests/test_h2_git_observation_guard.py \
            tests/test_h2_product_capabilities.py \
            tests/test_k5_operation_journal.py
          git diff --check
          git config user.name "AI Capital Maintainer"
          git config user.email "55954113+Alajmah@users.noreply.github.com"
          git add \
            src/ai_capital/product/process_observation.py \
            src/ai_capital/product/rooted_io.py \
            src/ai_capital/product/capability_operator.py \
            src/ai_capital/product/program_operator.py \
            src/ai_capital/product/git_repository_guard.py \
            src/ai_capital/product/capability_executors.py \
            tests/test_h2_reliability_restart_matrix.py \
            tests/test_h2_reliability_review.py \
            tests/test_h2_product_capability_review.py
          git commit -m "H2.7: close remaining reliability races"
          git push origin HEAD:h2-reliability-hardening
