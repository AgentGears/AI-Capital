name: H2.7 Host Dispatch Boundary Remediation

on:
  push:
    branches:
      - h2-reliability-remediation-v6

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: h2-reliability-hardening
          fetch-depth: 0
      - name: Apply remediation
        shell: bash
        run: |
          git fetch origin h2-reliability-remediation-v6
          git show origin/h2-reliability-remediation-v6:.github/h2-reliability-remediation-v6.py > /tmp/h2-reliability-remediation-v6.py
          python /tmp/h2-reliability-remediation-v6.py
      - name: Validate and push
        shell: bash
        run: |
          python -m pip install pytest
          PYTHONPATH=src python -m pytest -q tests/test_h2_reliability_hardening.py tests/test_h2_reliability_restart_matrix.py tests/test_k5_operation_journal.py tests/test_h2_product_capabilities.py
          git diff --check
          git config user.name "AI Capital Maintainer"
          git config user.email "55954113+Alajmah@users.noreply.github.com"
          git add src/ai_capital/kernel/operation_journal.py src/ai_capital/product/capability_operator.py tests/test_h2_reliability_hardening.py
          git commit -m "H2.7: enforce Host pre-dispatch stop gate"
          git push origin HEAD:h2-reliability-hardening
