name: K8 Round 37 autonomous remediation

on:
  push:
    branches:
      - k8-round37-autonomous-remediation

permissions:
  contents: write

jobs:
  remediate-and-prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply restart-authentication remediation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          context_path = Path('src/ai_capital/kernel/context.py')
          context = context_path.read_text()
          old_trigger = '''                    WHERE OLD.event_type = 'context.source_persisted'\n                      AND OLD.context_source_priority = 'host_control'\n                      AND OLD.context_source_program_id IS NOT NULL\n                      AND OLD.context_source_program_revision IS NOT NULL\n                      AND OLD.context_source_metadata_digest IS NOT NULL\n                      AND OLD.event_type IS NOT NEW.event_type;\n'''
          new_trigger = '''                    WHERE OLD.event_type = 'context.source_persisted'\n                      AND OLD.context_source_priority = 'host_control'\n                      AND OLD.context_source_program_id IS NOT NULL\n                      AND OLD.context_source_program_revision IS NOT NULL\n                      AND OLD.context_source_metadata_digest IS NOT NULL\n                      AND (\n                          OLD.event_type IS NOT NEW.event_type\n                          OR OLD.event_json IS NOT NEW.event_json\n                          OR OLD.event_digest IS NOT NEW.event_digest\n                      );\n'''
          if old_trigger not in context:
              raise SystemExit('Round 37 Host-control trigger anchor not found')
          context = context.replace(old_trigger, new_trigger, 1)

          old_receipts = '''                SELECT sequence, event_id, program_id, event_type, event_json, event_digest\n                FROM events\n                WHERE event_type = 'context.compiled' AND sequence > ?\n                ORDER BY sequence\n                LIMIT 1\n                \"\"\",\n                (last_sequence,),\n            ).fetchone()\n            if row is None:\n                break\n            event = self._decode_event_row(row)\n'''
          new_receipts = '''                SELECT sequence, event_id, program_id, event_type, event_json, event_digest,\n                       context_recall_invalidated\n                FROM events\n                WHERE event_type = 'context.compiled' AND sequence > ?\n                ORDER BY sequence\n                LIMIT 1\n                \"\"\",\n                (last_sequence,),\n            ).fetchone()\n            if row is None:\n                break\n            try:\n                invalidated = int(row[\"context_recall_invalidated\"])\n            except (TypeError, ValueError) as exc:\n                raise IntegrityViolation(\n                    \"compiled Context Event invalidation marker is malformed\"\n                ) from exc\n            if invalidated != 0:\n                raise IntegrityViolation(\"compiled Context Event was invalidated\")\n            event = self._decode_event_row(row)\n'''
          if old_receipts not in context:
              raise SystemExit('Round 37 receipt iterator anchor not found')
          context = context.replace(old_receipts, new_receipts, 1)
          context_path.write_text(context)

          evidence_path = Path('src/ai_capital/kernel/evidence_store.py')
          evidence = evidence_path.read_text()
          anchor = '''    def _rebuild_event_index(self) -> None:\n        self._host_store._db.execute(\"DELETE FROM evidence_event_index\")\n'''
          helper = '''    def _validate_rebuilt_event_record_binding(self, event: Event) -> None:\n        row = self._host_store._db.execute(\n            \"\"\"\n            SELECT evidence_id, artifact_digest, admitted_event_id,\n                   evidence_json, evidence_record_digest,\n                   admission_json, admission_digest\n            FROM evidence_records WHERE admitted_event_id = ?\n            \"\"\",\n            (event.event_id,),\n        ).fetchone()\n        if row is None:\n            raise IntegrityViolation(\n                \"Evidence admission Event lacks its durable Evidence record\"\n            )\n        try:\n            evidence = record_from_json(Evidence, row[\"evidence_json\"])\n            admission = record_from_json(\n                EvidenceAdmissionReceipt,\n                row[\"admission_json\"],\n            )\n        except (TypeError, ValueError) as exc:\n            raise IntegrityViolation(\n                \"Evidence migration record binding cannot be decoded\"\n            ) from exc\n        if not isinstance(evidence, Evidence) or not isinstance(\n            admission, EvidenceAdmissionReceipt\n        ):\n            raise IntegrityViolation(\n                \"Evidence migration record binding decoded wrong type\"\n            )\n        if (\n            evidence.evidence_id != row[\"evidence_id\"]\n            or evidence.digest != row[\"artifact_digest\"]\n            or canonical_digest(evidence) != row[\"evidence_record_digest\"]\n            or canonical_digest(admission) != row[\"admission_digest\"]\n            or admission.evidence_id != evidence.evidence_id\n            or admission.artifact_digest != evidence.digest\n            or row[\"admitted_event_id\"] != event.event_id\n        ):\n            raise IntegrityViolation(\n                \"Evidence migration record binding is inconsistent\"\n            )\n        self._validate_evidence(evidence)\n        expected_payload = to_canonical_data(\n            {\"evidence\": evidence, \"admission\": admission}\n        )\n        if (\n            event.correlation_id != evidence.evidence_id\n            or to_canonical_data(event.payload) != expected_payload\n        ):\n            raise IntegrityViolation(\n                \"Evidence record diverges from admission Event during migration\"\n            )\n\n    def _rebuild_event_index(self) -> None:\n        self._host_store._db.execute(\"DELETE FROM evidence_event_index\")\n'''
          if anchor not in evidence:
              raise SystemExit('Round 37 Evidence rebuild anchor not found')
          evidence = evidence.replace(anchor, helper, 1)
          old_index = '''            if not event.correlation_id:\n                raise IntegrityViolation(\"Evidence admission Event lacks Evidence identity\")\n            self._host_store._db.execute(\n'''
          new_index = '''            if not event.correlation_id:\n                raise IntegrityViolation(\"Evidence admission Event lacks Evidence identity\")\n            self._validate_rebuilt_event_record_binding(event)\n            self._host_store._db.execute(\n'''
          if old_index not in evidence:
              raise SystemExit('Round 37 Evidence index insertion anchor not found')
          evidence = evidence.replace(old_index, new_index, 1)
          evidence_path.write_text(evidence)

          Path('tests/test_k8_review_round37.py').write_text(r'''from __future__ import annotations

from dataclasses import replace
from pathlib import Path
import tempfile
import unittest

from ai_capital.kernel.context import ContextCompiler, ContextRepository
from ai_capital.kernel.durable_program import ProgramRepository
from ai_capital.kernel.enums import ContextPriority
from ai_capital.kernel.errors import IntegrityViolation
from ai_capital.kernel.events import event_digest_fields
from ai_capital.kernel.evidence_store import EvidenceRepository
from ai_capital.kernel.models import Event, Program
from ai_capital.kernel.schema_codec import record_from_json, record_to_json
from ai_capital.kernel.serialization import canonical_digest, to_canonical_data


class K8ReviewRound37Tests(unittest.TestCase):
    @staticmethod
    def _event(programs: ProgramRepository, event_id: str) -> Event:
        row = programs._db.execute(
            "SELECT event_json FROM events WHERE event_id = ?",
            (event_id,),
        ).fetchone()
        assert row is not None
        event = record_from_json(Event, row["event_json"])
        assert isinstance(event, Event)
        return event

    @staticmethod
    def _rewrite_event(
        programs: ProgramRepository,
        event: Event,
        payload: object,
    ) -> Event:
        digest = event_digest_fields(
            event_id=event.event_id,
            sequence=event.sequence,
            event_type=event.event_type,
            occurred_at=event.occurred_at,
            recorded_at=event.recorded_at,
            payload=payload,
            actor_id=event.actor_id,
            program_id=event.program_id,
            causation_id=event.causation_id,
            correlation_id=event.correlation_id,
        )
        forged = replace(event, payload=payload, digest=digest)
        programs._db.execute(
            "UPDATE events SET event_json = ?, event_digest = ? WHERE event_id = ?",
            (record_to_json(forged), digest, event.event_id),
        )
        return forged

    def test_same_selector_host_control_mutation_persists_invalidation_across_restart(self):
        with tempfile.TemporaryDirectory() as directory:
            database = Path(directory) / "host.db"
            programs = ProgramRepository(database)
            program = programs.create(
                Program("p-1", 0, "same-selector Host-control mutation")
            )
            contexts = ContextRepository(programs)
            source_ref = contexts.persist_source(
                program.program_id,
                priority=ContextPriority.HOST_CONTROL,
                payload={"rule": "mandatory"},
            )
            event_id = source_ref.removeprefix("event:")
            event = self._event(programs, event_id)
            payload = to_canonical_data(event.payload)
            source = payload["source"]
            source["payload"] = {"rule": "forged!!!"}
            source["source_digest"] = canonical_digest(source["payload"])
            self._rewrite_event(programs, event, payload)

            marker = programs._db.execute(
                "SELECT event_id FROM context_persisted_source_invalidations "
                "WHERE event_id = ?",
                (event_id,),
            ).fetchone()
            self.assertIsNotNone(marker)
            programs.close()

            reopened = ProgramRepository(database)
            try:
                contexts = ContextRepository(reopened)
                marker = reopened._db.execute(
                    "SELECT event_id FROM context_persisted_source_invalidations "
                    "WHERE event_id = ?",
                    (event_id,),
                ).fetchone()
                self.assertIsNotNone(marker)
                with self.assertRaisesRegex(
                    IntegrityViolation, "Host-control invalidation evidence"
                ):
                    ContextCompiler(contexts).compile(
                        program.program_id,
                        budget_units=100000,
                    )
            finally:
                reopened.close()

    def test_invalidated_compiled_event_fails_receipt_rebuild_on_restart(self):
        with tempfile.TemporaryDirectory() as directory:
            database = Path(directory) / "host.db"
            programs = ProgramRepository(database)
            program = programs.create(
                Program("p-1", 0, "compiled Event restart authentication")
            )
            contexts = ContextRepository(programs)
            compiled = ContextCompiler(contexts).compile(
                program.program_id,
                budget_units=100000,
            )
            event_id = str(
                programs._db.execute(
                    "SELECT compiled_event_id FROM context_receipts "
                    "WHERE context_receipt_id = ?",
                    (compiled.receipt.context_receipt_id,),
                ).fetchone()[0]
            )
            event = self._event(programs, event_id)
            payload = to_canonical_data(event.payload)
            source = payload["context"]["sources"][0]
            program_payload = source["payload"]["program"]
            original_objective = str(program_payload["objective"])
            program_payload["objective"] = "x" * len(original_objective)
            source["source_digest"] = canonical_digest(source["payload"])
            self._rewrite_event(programs, event, payload)
            invalidated = programs._db.execute(
                "SELECT context_recall_invalidated FROM events WHERE event_id = ?",
                (event_id,),
            ).fetchone()[0]
            self.assertEqual(int(invalidated), 1)
            programs.close()

            reopened = ProgramRepository(database)
            try:
                with self.assertRaisesRegex(
                    IntegrityViolation, "compiled Context Event was invalidated"
                ):
                    ContextRepository(reopened)
            finally:
                reopened.close()

    def test_legacy_evidence_rebuild_rejects_payload_record_divergence(self):
        for legacy_version in (2, 3):
            with self.subTest(version=legacy_version), tempfile.TemporaryDirectory() as directory:
                database = Path(directory) / "host.db"
                programs = ProgramRepository(database)
                evidence = EvidenceRepository(programs)
                item = evidence.admit(
                    content=b"round-37-evidence",
                    source_class="test",
                    observed_at="2026-01-01T00:00:00Z",
                    provenance=("round-37",),
                    trust_class="test",
                    currentness="current",
                )
                admitted_event_id = str(
                    evidence._row(item.evidence_id)["admitted_event_id"]
                )
                event = self._event(programs, admitted_event_id)
                payload = to_canonical_data(event.payload)
                payload["evidence"]["trust_class"] = "forged"
                programs._db.execute(
                    "DROP TRIGGER IF EXISTS evidence_admission_event_integrity_invalidate"
                )
                programs._db.execute(
                    "UPDATE component_schema SET version = ? "
                    "WHERE component = 'evidence_store'",
                    (legacy_version,),
                )
                self._rewrite_event(programs, event, payload)
                programs.close()

                reopened = ProgramRepository(database)
                try:
                    with self.assertRaisesRegex(
                        IntegrityViolation,
                        "Evidence record diverges from admission Event during migration",
                    ):
                        EvidenceRepository(reopened)
                finally:
                    reopened.close()


if __name__ == "__main__":
    unittest.main()
''')
          PY
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Focused Round 31-37 proof
        env:
          PYTHONPATH: src
        run: >-
          pytest -q
          tests/test_k8_review_round31.py
          tests/test_k8_review_round32.py
          tests/test_k8_review_round33.py
          tests/test_k8_review_round34.py
          tests/test_k8_review_round35.py
          tests/test_k8_review_round36.py
          tests/test_k8_review_round37.py
      - name: Exact source-test full proof
        env:
          PYTHONPATH: src
        run: pytest -q
      - name: Publish proved implementation commit
        shell: bash
        run: |
          rm .github/workflows/k8-round37-autonomous-remediation.yml
          git config user.name "AI Capital automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "K8: close Round 37 restart authentication gaps"
          git push origin HEAD:k8-bounded-context
