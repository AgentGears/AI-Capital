name: H2.7 Reliability Remediation v4

on:
  push:
    branches:
      - h2-reliability-remediation-v4

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: h2-reliability-hardening
          fetch-depth: 0
          path: target
      - uses: actions/checkout@v4
        with:
          ref: h2-reliability-remediation-v3
          path: helper
      - name: Reuse reviewed remediation script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path("helper/.github/workflows/h2-reliability-remediation-v3.yml").read_text().splitlines()

          def block(after: str) -> list[str]:
              start = next(i for i, line in enumerate(source) if line.strip() == after) + 1
              end = next(i for i in range(start, len(source)) if source[i].strip() == "PY")
              return [line[10:] if line.startswith("          ") else line for line in source[start:end]]

          Path("/tmp/h2_apply.py").write_text("\n".join(block("python - <<'PY'")) + "\n")
          Path("target/tests/test_h2_reliability_review.py").write_text(
              "\n".join(block("cat > tests/test_h2_reliability_review.py <<'PY'")) + "\n"
          )
          PY
          cd target
          python /tmp/h2_apply.py
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/test_h2_reliability_hardening.py")
          text = path.read_text()
          old = "            def swap_after_pin(base: Path, target: str):\n                nonlocal swapped\n                result = real_open_parent(base, target)\n"
          new = "            def swap_after_pin(base: Path, target: str, **kwargs):\n                nonlocal swapped\n                result = real_open_parent(base, target, **kwargs)\n"
          if text.count(old) != 1:
              raise SystemExit(f"parent-swap test seam changed: {text.count(old)}")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Validate and push
        shell: bash
        run: |
          cd target
          python -m pip install pytest
          PYTHONPATH=src python -m pytest -q tests/test_h2_reliability_review.py tests/test_h2_reliability_hardening.py tests/test_h2_product_capability_review.py tests/test_h2_product_capability_security.py
          git diff --check
          git config user.name "AI Capital Maintainer"
          git config user.email "55954113+Alajmah@users.noreply.github.com"
          git add src/ai_capital/product/capability_executors.py src/ai_capital/product/rooted_io.py src/ai_capital/product/capability_operator.py tests/test_h2_reliability_review.py tests/test_h2_reliability_hardening.py
          git commit -m "H2.7: remediate reliability review findings"
          git push origin HEAD:h2-reliability-hardening
